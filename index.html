<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Menu Makanan 📝✨</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 2px solid #f1f2f6;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--accent-color);
            padding-bottom: 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .header-title i {
            font-size: 1.6rem;
            color: var(--primary-color);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-add { background-color: var(--secondary-color); color: white; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn-print { background-color: #2d3436; color: white; }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .autosave-status {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2ecc71;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .table-wrapper {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            vertical-align: middle;
        }

        th {
            background-color: #fff2f2;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.88rem;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.88rem;
            line-height: 1.3;
        }

        td.editable {
            outline: none;
            cursor: text;
            transition: background 0.2s;
        }

        td.editable:focus {
            background-color: #e8f8f5;
            border-radius: 4px;
            box-shadow: inset 0 0 0 2px var(--secondary-color);
        }

        tr:nth-child(even) td {
            background-color: #fafafa;
        }

        /* Pembagian Lebar Kolom (Tanpa Kolom Aksi) */
        .col-no { width: 40px; text-align: center; font-weight: 700; color: #b2bec3; }
        .col-nama { width: 30%; }
        .col-makanan { width: 35%; }
        .col-minuman { width: 35%; }

        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .container { padding: 12px 10px; border-radius: 14px; }
            .header-title h1 { font-size: 1.2rem; }
            .header-title i { font-size: 1.3rem; }
            .btn { padding: 8px 10px; font-size: 0.8rem; }
            th, td { padding: 8px 4px; font-size: 0.82rem; }
            .col-no { width: 32px; }
            .autosave-status { width: 100%; margin-left: 0; margin-top: 5px; }
        }

        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { box-shadow: none !important; border: none !important; max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .header { border-bottom: 2px solid black !important; margin-bottom: 20px !important; }
            .header-title h1 { color: black !important; }
            table { width: 100% !important; table-layout: auto !important; border-collapse: collapse !important; filter: grayscale(100%) !important; }
            th, td { border: 1px solid black !important; color: black !important; background: transparent !important; padding: 8px 10px !important; }
            th { font-weight: bold !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-utensils"></i>
                <h1>Daftar Pemesanan Menu</h1>
            </div>
            <span class="no-print" style="font-size: 1.3rem;">🍳</span>
        </div>

        <div class="actions no-print">
            <button class="btn btn-add" onclick="addRow()">
                <i class="fa-solid fa-plus"></i> Tambah
            </button>
            <button class="btn btn-save" onclick="manualSave()">
                <i class="fa-solid fa-floppy-disk"></i> SIMPAN
            </button>
            <button class="btn btn-print" onclick="window.print()">
                <i class="fa-solid fa-print"></i> PRINT
            </button>
            <div class="autosave-status" id="saveStatus">
                <i class="fa-solid fa-cloud-check"></i> Tersimpan
            </div>
        </div>

        <div class="table-wrapper">
            <table id="orderTable">
                <thead>
                    <tr>
                        <th class="col-no">No.</th>
                        <th class="col-nama"><i class="fa-solid fa-user no-print"></i> Nama</th>
                        <th class="col-makanan"><i class="fa-solid fa-burger no-print"></i> Makanan</th>
                        <th class="col-minuman"><i class="fa-solid fa-mug-hot no-print"></i> Minuman</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA51cMtWZuIwnDpkklcR-WNnOn9QlCoLJc",
            authDomain: "menu-5959b.firebaseapp.com",
            databaseURL: "https://menu-5959b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "menu-5959b",
            storageBucket: "menu-5959b.firebasestorage.app",
            messagingSenderId: "923952291645",
            appId: "1:923952291645:web:63c78ed9cefc55eb566f54"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const defaultOrders = [
            { nama: "Budi", makanan: "Nasi Goreng Spesial", minuman: "Es Teh Manis Jumbo" },
            { nama: "Andi", makanan: "Mie Ayam Bakso", minuman: "Jus Jeruk Peras" },
            { nama: "Citra", makanan: "Ayam Bakar Madu", minuman: "Air Mineral" }
        ];

        let orders = JSON.parse(localStorage.getItem("saved_menu_orders")) || defaultOrders;
        let autosaveTimer = null;
        let isEditing = false;

        function renderTable() {
            orders.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            orders.forEach((order, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-no">${index + 1}</td>
                    <td class="editable col-nama" contenteditable="true" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'nama', this.innerText)">${order.nama}</td>
                    <td class="editable col-makanan" contenteditable="true" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'makanan', this.innerText)">${order.makanan}</td>
                    <td class="editable col-minuman" contenteditable="true" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'minuman', this.innerText)">${order.minuman}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateLocalData(index, field, value) {
            orders[index][field] = value.trim();
            saveToLocalStorage();
            triggerAutosave();
        }

        function saveToLocalStorage() {
            localStorage.setItem("saved_menu_orders", JSON.stringify(orders));
        }

        function triggerAutosave() {
            const statusEl = document.getElementById('saveStatus');
            statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;
            statusEl.style.color = '#e67e22';

            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => {
                pushToFirebase(false);
            }, 1000);
        }

        async function pushToFirebase(showAlert = false) {
            try {
                orders.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
                saveToLocalStorage();

                await db.collection("orders").doc("latest_menu").set({
                    items: orders,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const statusEl = document.getElementById('saveStatus');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud-check"></i> Tersimpan`;
                statusEl.style.color = '#2ecc71';

                if (showAlert) {
                    alert("✅ Data pemesanan berhasil disimpan ke Cloud Firebase & diurutkan A-Z!");
                }
            } catch (error) {
                console.error("Firebase Error: ", error);
                const statusEl = document.getElementById('saveStatus');
                statusEl.innerHTML = `<i class="fa-solid fa-hard-drive"></i> Tersimpan Lokal`;
                statusEl.style.color = '#3498db';

                if (showAlert) {
                    alert("⚠️ Data tersimpan di memori lokal HP/Browser.");
                }
            }
        }

        function manualSave() {
            pushToFirebase(true);
        }

        function addRow() {
            orders.push({ nama: "", makanan: "", minuman: "" });
            saveToLocalStorage();
            renderTable();
            triggerAutosave();

            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length > 0) {
                const lastRowNama = rows[rows.length - 1].children[1];
                lastRowNama.focus();
            }
        }

        function initRealtimeData() {
            renderTable();

            db.collection("orders").doc("latest_menu").onSnapshot((doc) => {
                if (!isEditing && doc.exists && doc.data().items) {
                    orders = doc.data().items;
                    saveToLocalStorage();
                    renderTable();
                }
            }, (error) => {
                console.warn("Realtime listener terhambat, menggunakan data lokal:", error);
            });
        }

        window.onload = () => {
            initRealtimeData();
        };
    </script>
</body>
</html>
