<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Menu Makanan 📝✨</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
            --text-color: #2d3436;
            --border-color: #dfe6e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 2px solid #f1f2f6;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--accent-color);
            padding-bottom: 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .header-title i {
            font-size: 1.6rem;
            color: var(--primary-color);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-add { background-color: var(--secondary-color); color: white; }
        .btn-delete-mode { background-color: #ff7675; color: white; }
        .btn-delete-active { background-color: #d63031; color: white; animation: pulse 1.5s infinite; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn-print { background-color: #2d3436; color: white; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .autosave-status {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2ecc71;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .table-wrapper {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            vertical-align: middle;
        }

        th {
            background-color: #fff2f2;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.88rem;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.88rem;
            line-height: 1.3;
        }

        td.editable {
            outline: none;
            cursor: text;
            transition: background 0.2s;
        }

        td.editable:focus {
            background-color: #e8f8f5;
            border-radius: 4px;
            box-shadow: inset 0 0 0 2px var(--secondary-color);
        }

        tr:nth-child(even) td {
            background-color: #fafafa;
        }

        /* Tampilan saat Mode Hapus Aktif */
        body.delete-mode-active tr.row-item {
            cursor: pointer;
        }

        /* Blok Warna Mencolok untuk Baris Terpilih (Kalimat Tetap Terbaca Jelas) */
        tr.row-selected-delete td {
            background-color: #ff9f43 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.4);
        }

        tr.row-selected-delete td.col-no {
            color: #ffffff !important;
        }

        .col-no { width: 40px; text-align: center; font-weight: 700; color: #b2bec3; }
        .col-nama { width: 30%; }
        .col-makanan { width: 35%; }
        .col-minuman { width: 35%; }

        /* Custom Centered Modal Overlay & Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            padding: 24px 28px;
            border-radius: 20px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transform: scale(0.8);
            transition: transform 0.2s ease;
            border: 3px solid var(--border-color);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 0.95rem;
            color: #636e72;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-modal {
            padding: 9px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-modal-confirm { background-color: #ff7675; color: white; }
        .btn-modal-cancel { background-color: #dfe6e9; color: var(--text-color); }
        .btn-modal-ok { background-color: var(--secondary-color); color: white; }

        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .container { padding: 12px 10px; border-radius: 14px; }
            .header-title h1 { font-size: 1.2rem; }
            .header-title i { font-size: 1.3rem; }
            .btn { padding: 8px 10px; font-size: 0.8rem; }
            th, td { padding: 8px 4px; font-size: 0.82rem; }
            .col-no { width: 32px; }
            .autosave-status { width: 100%; margin-left: 0; margin-top: 5px; }
        }

        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { box-shadow: none !important; border: none !important; max-width: 100% !important; width: 100% !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .header { border-bottom: 2px solid black !important; margin-bottom: 20px !important; }
            .header-title h1 { color: black !important; }
            table { width: 100% !important; table-layout: auto !important; border-collapse: collapse !important; filter: grayscale(100%) !important; }
            th, td { border: 1px solid black !important; color: black !important; background: transparent !important; padding: 8px 10px !important; }
            th { font-weight: bold !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-utensils"></i>
                <h1>Daftar Pemesanan Menu</h1>
            </div>
            <span class="no-print" style="font-size: 1.3rem;">🍳</span>
        </div>

        <div class="actions no-print">
            <button class="btn btn-add" id="btnAdd" onclick="addRow()">
                <i class="fa-solid fa-plus"></i> Tambah
            </button>
            <button class="btn btn-delete-mode" id="btnDelete" onclick="handleDeleteButtonClick()">
                <i class="fa-solid fa-trash"></i> HAPUS
            </button>
            <button class="btn btn-save" onclick="manualSave()">
                <i class="fa-solid fa-floppy-disk"></i> SIMPAN
            </button>
            <button class="btn btn-print" onclick="window.print()">
                <i class="fa-solid fa-print"></i> PRINT
            </button>
            <div class="autosave-status" id="saveStatus">
                <i class="fa-solid fa-cloud-check"></i> Tersimpan
            </div>
        </div>

        <div class="table-wrapper">
            <table id="orderTable">
                <thead>
                    <tr>
                        <th class="col-no">No.</th>
                        <th class="col-nama"><i class="fa-solid fa-user no-print"></i> Nama</th>
                        <th class="col-makanan"><i class="fa-solid fa-burger no-print"></i> Makanan</th>
                        <th class="col-minuman"><i class="fa-solid fa-mug-hot no-print"></i> Minuman</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Custom Modal Popup (Tengah Layar) -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <div class="modal-title" id="modalTitle">Konfirmasi</div>
            <div class="modal-message" id="modalMessage">Pesan notifikasi di sini...</div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA51cMtWZuIwnDpkklcR-WNnOn9QlCoLJc",
            authDomain: "menu-5959b.firebaseapp.com",
            databaseURL: "https://menu-5959b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "menu-5959b",
            storageBucket: "menu-5959b.firebasestorage.app",
            messagingSenderId: "923952291645",
            appId: "1:923952291645:web:63c78ed9cefc55eb566f54"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const defaultOrders = [
            { nama: "Budi", makanan: "Nasi Goreng Spesial", minuman: "Es Teh Manis Jumbo" },
            { nama: "Andi", makanan: "Mie Ayam Bakso", minuman: "Jus Jeruk Peras" },
            { nama: "Citra", makanan: "Ayam Bakar Madu", minuman: "Air Mineral" }
        ];

        let orders = JSON.parse(localStorage.getItem("saved_menu_orders")) || defaultOrders;
        let autosaveTimer = null;
        let isEditing = false;

        // State Pengelolaan Mode Hapus
        let isDeleteMode = false;
        let selectedIndicesToDelete = new Set();

        function renderTable() {
            orders.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            orders.forEach((order, index) => {
                const tr = document.createElement('tr');
                tr.className = 'row-item';
                
                if (selectedIndicesToDelete.has(index)) {
                    tr.classList.add('row-selected-delete');
                }

                tr.innerHTML = `
                    <td class="col-no">${index + 1}</td>
                    <td class="editable col-nama" contenteditable="${!isDeleteMode}" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'nama', this.innerText)">${order.nama}</td>
                    <td class="editable col-makanan" contenteditable="${!isDeleteMode}" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'makanan', this.innerText)">${order.makanan}</td>
                    <td class="editable col-minuman" contenteditable="${!isDeleteMode}" 
                        onfocus="isEditing = true" 
                        onblur="isEditing = false"
                        oninput="updateLocalData(${index}, 'minuman', this.innerText)">${order.minuman}</td>
                `;

                // Klik Baris saat Mode Hapus untuk Menandai/Membatalkan Baris
                tr.addEventListener('click', (e) => {
                    if (isDeleteMode) {
                        e.preventDefault();
                        toggleSelectRow(index);
                    }
                });

                tbody.appendChild(tr);
            });

            updateDeleteButtonUI();
        }

        function handleDeleteButtonClick() {
            if (!isDeleteMode) {
                // Masuk ke Mode Hapus
                isDeleteMode = true;
                document.body.classList.add('delete-mode-active');
                renderTable();
            } else {
                if (selectedIndicesToDelete.size === 0) {
                    // Keluar dari Mode Hapus jika tidak ada baris yang dipilih
                    exitDeleteMode();
                } else {
                    // Eksekusi Proses Hapus dengan Konfirmasi 2 Tingkat
                    startFirstDeleteConfirmation();
                }
            }
        }

        function toggleSelectRow(index) {
            if (selectedIndicesToDelete.has(index)) {
                selectedIndicesToDelete.delete(index);
            } else {
                selectedIndicesToDelete.add(index);
            }
            renderTable();
        }

        function updateDeleteButtonUI() {
            const btnDelete = document.getElementById('btnDelete');
            if (isDeleteMode) {
                btnDelete.classList.remove('btn-delete-mode');
                btnDelete.classList.add('btn-delete-active');
                if (selectedIndicesToDelete.size > 0) {
                    btnDelete.innerHTML = `<i class="fa-solid fa-trash-can"></i> HAPUS (${selectedIndicesToDelete.size})`;
                } else {
                    btnDelete.innerHTML = `<i class="fa-solid fa-xmark"></i> BATAL HAPUS`;
                }
            } else {
                btnDelete.classList.remove('btn-delete-active');
                btnDelete.classList.add('btn-delete-mode');
                btnDelete.innerHTML = `<i class="fa-solid fa-trash"></i> HAPUS`;
            }
        }

        function exitDeleteMode() {
            isDeleteMode = false;
            selectedIndicesToDelete.clear();
            document.body.classList.remove('delete-mode-active');
            renderTable();
        }

        /* 1. Pop-Up Konfirmasi Pertama di Tengah Layar */
        function startFirstDeleteConfirmation() {
            const count = selectedIndicesToDelete.size;
            showCustomModal(
                "❓",
                "Konfirmasi Penghapusan",
                `Apakah Anda yakin ingin menghapus <b>${count} baris</b> yang telah ditandai?`,
                [
                    { text: "Batal", class: "btn-modal-cancel", onClick: closeModal },
                    { text: "Lanjutkan", class: "btn-modal-confirm", onClick: startSecondDeleteConfirmation }
                ]
            );
        }

        /* 2. Pop-Up Konfirmasi Kedua di Tengah Layar */
        function startSecondDeleteConfirmation() {
            closeModal();
            setTimeout(() => {
                showCustomModal(
                    "⚠️",
                    "Peringatan Terakhir!",
                    "Tindakan ini tidak dapat dibatalkan. Baris terpilih akan dihapus permanen!",
                    [
                        { text: "Batalkan", class: "btn-modal-cancel", onClick: closeModal },
                        { text: "Hapus Sekarang", class: "btn-modal-confirm", onClick: executeDeletion }
                    ]
                );
            }, 200);
        }

        /* 3. Eksekusi Penghapusan Data & Pop-Up Notifikasi Berhasil di Tengah Layar */
        function executeDeletion() {
            closeModal();

            // Hapus baris terpilih dari array
            orders = orders.filter((_, index) => !selectedIndicesToDelete.has(index));
            saveToLocalStorage();
            exitDeleteMode();
            triggerAutosave();

            setTimeout(() => {
                showCustomModal(
                    "✅",
                    "Penghapusan Berhasil!",
                    "Baris terpilih telah berhasil dihapus dari daftar.",
                    [
                        { text: "OK", class: "btn-modal-ok", onClick: closeModal }
                    ]
                );
            }, 200);
        }

        function showCustomModal(icon, title, messageHTML, buttons) {
            document.getElementById('modalIcon').innerHTML = icon;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerHTML = messageHTML;

            const buttonsContainer = document.getElementById('modalButtons');
            buttonsContainer.innerHTML = '';

            buttons.forEach(btnConfig => {
                const btn = document.createElement('button');
                btn.className = `btn-modal ${btnConfig.class}`;
                btn.innerHTML = btnConfig.text;
                btn.onclick = btnConfig.onClick;
                buttonsContainer.appendChild(btn);
            });

            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function updateLocalData(index, field, value) {
            orders[index][field] = value.trim();
            saveToLocalStorage();
            triggerAutosave();
        }

        function saveToLocalStorage() {
            localStorage.setItem("saved_menu_orders", JSON.stringify(orders));
        }

        function triggerAutosave() {
            const statusEl = document.getElementById('saveStatus');
            statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;
            statusEl.style.color = '#e67e22';

            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => {
                pushToFirebase(false);
            }, 1000);
        }

        async function pushToFirebase(showAlert = false) {
            try {
                orders.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
                saveToLocalStorage();

                await db.collection("orders").doc("latest_menu").set({
                    items: orders,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const statusEl = document.getElementById('saveStatus');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud-check"></i> Tersimpan`;
                statusEl.style.color = '#2ecc71';

                if (showAlert) {
                    showCustomModal(
                        "💾",
                        "Penyimpanan Berhasil!",
                        "Data pemesanan berhasil disimpan ke Cloud Firebase!",
                        [{ text: "OK", class: "btn-modal-ok", onClick: closeModal }]
                    );
                }
            } catch (error) {
                console.error("Firebase Error: ", error);
                const statusEl = document.getElementById('saveStatus');
                statusEl.innerHTML = `<i class="fa-solid fa-hard-drive"></i> Tersimpan Lokal`;
                statusEl.style.color = '#3498db';

                if (showAlert) {
                    showCustomModal(
                        "💾",
                        "Tersimpan di Memori Lokal",
                        "Data tersimpan di perangkat ini.",
                        [{ text: "OK", class: "btn-modal-ok", onClick: closeModal }]
                    );
                }
            }
        }

        function manualSave() {
            pushToFirebase(true);
        }

        function addRow() {
            if (isDeleteMode) exitDeleteMode();
            orders.push({ nama: "", makanan: "", minuman: "" });
            saveToLocalStorage();
            renderTable();
            triggerAutosave();

            const rows = document.querySelectorAll('#tableBody tr');
            if (rows.length > 0) {
                const lastRowNama = rows[rows.length - 1].children[1];
                lastRowNama.focus();
            }
        }

        function initRealtimeData() {
            renderTable();

            db.collection("orders").doc("latest_menu").onSnapshot((doc) => {
                if (!isEditing && !isDeleteMode && doc.exists && doc.data().items) {
                    orders = doc.data().items;
                    saveToLocalStorage();
                    renderTable();
                }
            }, (error) => {
                console.warn("Realtime listener terhambat, menggunakan data lokal:", error);
            });
        }

        window.onload = () => {
            initRealtimeData();
        };
    </script>
</body>
</html>
